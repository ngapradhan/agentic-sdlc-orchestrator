[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "Offline controlled agentic SDLC prototype with a URL shortener"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0.36,<2.1", "jsonschema>=4.23,<5", "httpx>=0.27,<1", "fastapi>=0.115,<1", "alembic>=1.14,<2", "uvicorn>=0.34,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema>=4.23", "types-PyYAML>=6"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "shortener*"]

[tool.setuptools.package-data]
orchestrator = ["fixtures/*.json", "schemas/*.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["orchestrator", "shortener"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
